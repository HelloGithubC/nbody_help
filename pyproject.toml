[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbody_help"
version = "0.1.0"
description = "A package to help with N-body simulation tasks, including parameter handling and data I/O"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Liang Xiao", email = "xiaoliangms@outlook.com"},
]
keywords = ["nbody", "simulation", "cosmology", "large-scale structure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy",
    "astropy",
]

[project.optional-dependencies]
cosmo = ["colibri"]
dev = ["pytest", "pytest-cov", "black", "flake8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nbody_help*"]
